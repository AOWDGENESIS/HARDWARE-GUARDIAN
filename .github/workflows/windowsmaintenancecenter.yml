name: Windows Maintenance Center

# The Windows environment this project needs. There is no local Windows machine and no hypervisor
# available, so the build, the tests and the packaging run on a GitHub hosted Windows runner. That
# machine is a virtual machine: it has a real Windows kernel, a real .NET SDK, real WMI and real
# PowerShell, but no physical sensors, no battery, no discrete GPU and no interactive UAC prompt.
# What that means for the module status is written into the environment record and into
# docs/ABNAHME-WMC.md - a result from here is never a substitute for the run on the target machine.
#
# Two independent jobs:
#   checks    - the checks that need no Windows and no SDK (contracts, localisation, XAML, projects,
#               syntax). They run on every push so that an invented member or a missing key is caught
#               immediately.
#   windows   - the real build, the real tests and the release artefacts. This is the job that
#               produces the evidence the project is missing.
#
# Every step writes its output into a log file, and the last step copies those logs and the test
# results into test-results/ci/<run>/ on this branch. Without that, a failing run would leave nothing
# behind that can be read from outside the runner.
#
# Nothing in this workflow is allowed to report success without having run. A skipped or failed step
# fails the job; there is no "continue on error" for build and test.

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'WindowsMaintenanceCenter/**'
      - '.github/workflows/windowsmaintenancecenter.yml'
  pull_request:
    paths:
      - 'WindowsMaintenanceCenter/**'
      - '.github/workflows/windowsmaintenancecenter.yml'
  workflow_dispatch:

permissions:
  # Write is needed for exactly one thing: putting the run logs and the test results back into the
  # branch so that they can be read. The application code is never changed by this workflow.
  contents: write

env:
  # The application ships no telemetry (spec section 28) and the build sends none either.
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

defaults:
  run:
    working-directory: WindowsMaintenanceCenter

jobs:
  checks:
    name: Checks without SDK (contracts, localisation, XAML, projects, syntax)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the C# grammar for the syntax check
        run: |
          python -m pip install --disable-pip-version-check tree-sitter==0.26.0 tree-sitter-c-sharp
      - name: Run every available check
        run: bash tools/verify-all.sh

  windows:
    name: Build, test and package (Windows, .NET 10)
    runs-on: windows-latest
    # A run that hangs has to end by itself. The first attempt of the installation cycle did not, and
    # the job then held a runner until it was cancelled by hand (which this access cannot do).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Record what this machine is (evidence, not a claim)
        shell: pwsh
        run: |
          $out = 'artifacts/ci/environment.txt'
          New-Item -ItemType Directory -Force -Path (Split-Path $out) | Out-Null
          $lines = New-Object System.Collections.Generic.List[string]
          function Probe([string]$name, [scriptblock]$body) {
            try { $lines.Add("$name=$(& $body)") }
            catch { $lines.Add("$name=not readable ($($_.Exception.GetType().Name): $($_.Exception.Message))") }
          }
          $lines.Add("run=$env:GITHUB_RUN_ID attempt=$env:GITHUB_RUN_ATTEMPT")
          $lines.Add("ref=$env:GITHUB_REF commit=$env:GITHUB_SHA actor=$env:GITHUB_ACTOR")
          $lines.Add("runner=$env:RUNNER_NAME image=$env:ImageOS os=$env:RUNNER_OS arch=$env:RUNNER_ARCH")
          Probe 'os' { Get-CimInstance Win32_OperatingSystem | ForEach-Object { "$($_.Caption) version=$($_.Version) build=$($_.BuildNumber) arch=$($_.OSArchitecture)" } }
          Probe 'model' { Get-CimInstance Win32_ComputerSystem | ForEach-Object { "$($_.Manufacturer) $($_.Model) hypervisorPresent=$($_.HypervisorPresent)" } }
          Probe 'cpu' { Get-CimInstance Win32_Processor | Select-Object -First 1 | ForEach-Object { "$($_.Name) cores=$($_.NumberOfCores) logical=$($_.NumberOfLogicalProcessors)" } }
          Probe 'memory_gb' { [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 1) }
          Probe 'disk_gb' { [math]::Round((Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'").Size / 1GB, 1) }
          Probe 'psversion' { $PSVersionTable.PSVersion.ToString() }
          Probe 'dotnet' { (dotnet --version) }
          Probe 'sdks' { (dotnet --list-sdks) -join ' | ' }
          Probe 'runtimes' { (dotnet --list-runtimes | Select-String 'WindowsDesktop|Microsoft.NETCore.App') -join ' | ' }
          Probe 'msbuild' { (& dotnet msbuild -version -nologo | Select-Object -Last 1) }
          Probe 'iscc' { if (Get-Command iscc.exe -ErrorAction SilentlyContinue) { (Get-Command iscc.exe).Source } else { 'not installed yet' } }
          # What this machine does not have. Saying it here is cheaper than finding it out later in a
          # module that claims to have measured something.
          Probe 'thermal_zones' { (Get-CimInstance -Namespace root/wmi -ClassName MSAcpi_ThermalZoneTemperature -ErrorAction Stop | Measure-Object).Count }
          Probe 'battery' { (Get-CimInstance Win32_Battery -ErrorAction SilentlyContinue | Measure-Object).Count }
          Probe 'gpu' { (Get-CimInstance Win32_VideoController -ErrorAction SilentlyContinue | ForEach-Object { $_.Name }) -join ', ' }
          Probe 'smart_status' { (Get-CimInstance -Namespace root/wmi -ClassName MSStorageDriver_FailurePredictStatus -ErrorAction Stop | Measure-Object).Count }
          Probe 'tpm' { (Get-CimInstance -Namespace root/cimv2/security/microsofttpm -ClassName Win32_Tpm -ErrorAction Stop | ForEach-Object { "present spec=$($_.SpecVersion) enabled=$($_.IsEnabled_InitialValue)" }) }
          $lines.Add('physical_machine=false (a hosted runner is a virtual machine; hardware, sensor, UAC and reboot tests stay BLOCKED here)')
          $lines | Set-Content -Encoding utf8 $out
          $lines | ForEach-Object { Write-Host $_ }

      - name: Restore
        shell: pwsh
        run: |
          $log = 'artifacts/ci/restore.log'
          New-Item -ItemType Directory -Force -Path (Split-Path $log) | Out-Null
          dotnet restore WindowsMaintenanceCenter.sln -p:RestoreLockedMode=false --use-lock-file *>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "dotnet restore failed with exit code $LASTEXITCODE (see artifacts/ci/restore.log)" }

      - name: Report the lock files (a restore that creates them is not a restore that verified them)
        shell: pwsh
        run: |
          $changed = git status --porcelain -- '*packages.lock.json'
          if ($changed) {
            Write-Host 'Lock files were created or changed by this restore. They belong into the repository:'
            $changed | ForEach-Object { Write-Host "  $_" }
          } else {
            Write-Host 'Every lock file was already present and unchanged.'
          }

      - name: Build
        shell: pwsh
        run: |
          $log = 'artifacts/ci/build.log'
          dotnet build WindowsMaintenanceCenter.sln -c Release --no-restore -p:ContinuousIntegrationBuild=true *>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "dotnet build failed with exit code $LASTEXITCODE (see artifacts/ci/build.log)" }

      # Compiler output is long and the run log is not readable from everywhere. This step reduces it
      # to what has to be fixed: how many errors, which codes, and the first line of each distinct
      # message. It writes its result next to the other run logs.
      - name: Summarise the compiler output
        if: always()
        shell: pwsh
        run: |
          $log = 'artifacts/ci/build.log'
          $summary = 'artifacts/ci/build-summary.txt'
          New-Item -ItemType Directory -Force -Path (Split-Path $summary) | Out-Null
          if (-not (Test-Path $log)) { 'no build log was written' | Set-Content $summary; exit 0 }
          $lines = Get-Content $log
          $diagnostics = $lines | Select-String -Pattern '\serror [A-Z]+[0-9]+:|\swarning [A-Z]+[0-9]+:' |
            ForEach-Object {
              $text = $_.Line -replace '\s*\[[A-Z]:.*$', ''
              if ($text -match '^(?<file>.+?)\((?<line>\d+),\d+\): (?<kind>error|warning) (?<code>[A-Z]+\d+): (?<message>.*)$') {
                [pscustomobject]@{ File = $Matches.file; Line = $Matches.line; Kind = $Matches.kind; Code = $Matches.code; Message = $Matches.message.Trim() }
              }
            }
          $out = New-Object System.Collections.Generic.List[string]
          $out.Add("errors=$(@($diagnostics | Where-Object Kind -eq 'error').Count) warnings=$(@($diagnostics | Where-Object Kind -eq 'warning').Count)")
          $out.Add('')
          $out.Add('errors by code:')
          $diagnostics | Where-Object Kind -eq 'error' | Group-Object Code | Sort-Object Count -Descending |
            ForEach-Object { $out.Add("  $($_.Count)  $($_.Name)") }
          $out.Add('')
          $out.Add('distinct error messages:')
          $diagnostics | Where-Object Kind -eq 'error' |
            Group-Object { ($_.Message -replace "'[^']*'", "'X'") } | Sort-Object Count -Descending |
            ForEach-Object {
              $first = $_.Group[0]
              $out.Add("  $($_.Count)x $($first.File -replace '.*WindowsMaintenanceCenter', '')($($first.Line)): $($first.Message)")
            }
          $out.Add('')
          $out.Add('warnings by code:')
          $diagnostics | Where-Object Kind -eq 'warning' | Group-Object Code | Sort-Object Count -Descending |
            ForEach-Object { $out.Add("  $($_.Count)  $($_.Name)") }
          $out | Set-Content -Encoding utf8 $summary
          $out | Select-Object -First 40 | ForEach-Object { Write-Host $_ }

      - name: Tests
        shell: pwsh
        run: |
          $log = 'artifacts/ci/test.log'
          pwsh ./scripts/test.ps1 -Configuration Release *>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "the test run failed with exit code $LASTEXITCODE (see artifacts/ci/test.log)" }

      - name: Publish the portable executable
        shell: pwsh
        run: |
          $log = 'artifacts/ci/publish.log'
          pwsh ./scripts/build.ps1 -Configuration Release -RuntimeIdentifier win-x64 -OutputDirectory artifacts/portable *>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "the publish failed with exit code $LASTEXITCODE (see artifacts/ci/publish.log)" }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $log = 'artifacts/ci/innosetup.log'
          choco install innosetup --no-progress -y *>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "the installer build could not be set up (exit code $LASTEXITCODE)" }

      - name: Build installer, checksums and release notes
        shell: pwsh
        run: |
          $log = 'artifacts/ci/release.log'
          pwsh ./scripts/release.ps1 *>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "the release build failed with exit code $LASTEXITCODE (see artifacts/ci/release.log)" }

      - name: Check that the release really produced the four required artefacts
        shell: pwsh
        run: |
          $release = 'artifacts/release'
          $required = @(
            'WindowsMaintenanceCenter-Portable-x64.exe',
            'WindowsMaintenanceCenter-Setup-x64.exe',
            'WindowsMaintenanceCenter-Checksums.txt',
            'WindowsMaintenanceCenter-ReleaseNotes.txt',
            'WindowsMaintenanceCenter-Portable-README.txt'
          )
          foreach ($name in $required) {
            $path = Join-Path $release $name
            if (-not (Test-Path $path)) { throw "the release is incomplete: $name is missing" }
            $size = (Get-Item $path).Length
            if ($size -le 0) { throw "$name is empty" }
            Write-Host ("{0,-40} {1,12:N0} bytes" -f $name, $size)
          }

      - name: Verify the checksum file against the artefacts
        shell: pwsh
        run: |
          $release = 'artifacts/release'
          $expected = Get-Content "$release/WindowsMaintenanceCenter-Checksums.txt"
          foreach ($line in $expected) {
            if ([string]::IsNullOrWhiteSpace($line)) { continue }
            $parts = $line -split '\s+', 2
            $actual = (Get-FileHash -Algorithm SHA256 "$release/$($parts[1])").Hash.ToLowerInvariant()
            if ($actual -ne $parts[0]) { throw "checksum mismatch for $($parts[1])" }
          }
          Write-Host 'all checksums match the artefacts'

      # Gate 7 (chapter 62): install, start, probe that it really ran, uninstall, and prove that the
      # portable artefact keeps its data next to itself. The evidence lands in test-results/installer
      # and is recorded with the run like every other proof.
      # The step has a hard upper limit: the first attempt (run 35695298315) never finished and kept a
      # runner busy until it was cancelled. With a limit the run ends, the record step below still
      # writes the log into the branch, and the log says where it stood.
      - name: Installation cycle on this machine (gate 7)
        timeout-minutes: 15
        shell: pwsh
        run: |
          $log = 'artifacts/ci/installer-cycle.log'
          pwsh ./scripts/vm/Test-InstallerCycle.ps1 -StartedBy "ci-runner $env:GITHUB_RUN_ID" *>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "the installation cycle found problems (see artifacts/ci/installer-cycle.log and test-results/installer)" }

      # The runner is the only machine that can see the build output, and its own log download is not
      # reachable from where this project is developed. So the run writes its logs and its test results
      # into the branch: that is the evidence, and it stays readable after the runner is gone.
      - name: Keep the run record in the branch
        if: always()
        shell: pwsh
        run: |
          $run = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $target = "test-results/ci/run-$run"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          if (Test-Path 'artifacts/ci') { Copy-Item 'artifacts/ci/*' -Destination $target -Force }
          if (Test-Path 'artifacts/test-results') { Copy-Item 'artifacts/test-results/*' -Destination $target -Force }
          Copy-Item 'artifacts/portable/*' -Destination $target -Force -ErrorAction SilentlyContinue | Out-Null
          Get-ChildItem -Path $target -Recurse -File | Where-Object { $_.Length -gt 2MB } | ForEach-Object {
            Write-Host "not keeping $($_.Name): $($_.Length) bytes"
            Remove-Item $_.FullName
          }
          $summary = @(
            "run=$env:GITHUB_RUN_ID attempt=$env:GITHUB_RUN_ATTEMPT",
            "ref=$env:GITHUB_REF commit=$env:GITHUB_SHA",
            "job_status=$env:JOB_STATUS"
          )
          $summary | Set-Content -Encoding utf8 (Join-Path $target 'run.txt')
          # The unit test proof of chapter 71 belongs into test-results/unit, not only into the run
          # folder: scripts/test.ps1 files it there with timestamp, version, build, environment and
          # result. Both places are recorded, because the run folder also carries the build, publish
          # and installer logs.
          $unitEvidence = 'test-results/unit'
          git config user.name 'Windows Maintenance Center CI'
          git config user.email 'ci@users.noreply.github.com'
          git add --force $target
          $staged = git status --porcelain $target
          # The installation cycle files its own proof under test-results/installer; it belongs into the
          # record for the same reason as the unit proof.
          $installerEvidence = 'test-results/installer'
          if (Test-Path $installerEvidence) {
            Get-ChildItem -Path $installerEvidence -Recurse -File | Where-Object { $_.Length -gt 8MB } | ForEach-Object {
              Write-Host "not keeping $($_.Name): $($_.Length) bytes"
              Remove-Item $_.FullName
            }
            git add --force $installerEvidence
            $staged += git status --porcelain $installerEvidence
          }
          if (Test-Path $unitEvidence) {
            # The TRX file is the proof of the unit run; only something implausibly large is left out,
            # and then the console log next to it still names every case.
            Get-ChildItem -Path $unitEvidence -Recurse -File | Where-Object { $_.Length -gt 8MB } | ForEach-Object {
              Write-Host "not keeping $($_.Name): $($_.Length) bytes"
              Remove-Item $_.FullName
            }
            git add --force $unitEvidence
            $staged += git status --porcelain $unitEvidence
          }
          if (-not $staged) { Write-Host 'nothing new to record'; exit 0 }
          git commit -m "CI-Lauf $run aufzeichnen [skip ci]" | Write-Host
          git push origin "HEAD:$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw "the run record could not be pushed" }
        env:
          JOB_STATUS: ${{ job.status }}

      - name: Upload the artefacts, the test results, the lock files and the environment record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windowsmaintenancecenter-release
          path: |
            WindowsMaintenanceCenter/artifacts/release/*
            WindowsMaintenanceCenter/artifacts/test-results/*
            WindowsMaintenanceCenter/artifacts/ci/*
            WindowsMaintenanceCenter/**/packages.lock.json
          if-no-files-found: warn
          retention-days: 30
